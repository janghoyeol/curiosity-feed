# fly.io 배포 설정
# 앱 이름은 전역적으로 유일해야 해서, 이미 쓰이고 있으면 바꿔야 함
app = "curiosity-feed"
primary_region = "nrt" # 도쿄 - 한국에서 가장 가까운 리전

[build]

[env]
  DATABASE_URL = "sqlite:////data/curiosity_feed.db"
  ENABLE_SCHEDULER = "true"

[[mounts]]
  source = "curiosity_feed_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # 스케줄러가 계속 돌아야 해서 유휴 상태에도 머신을 끄지 않음
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
